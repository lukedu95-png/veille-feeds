name: Collecte veille

on:
  schedule:
    # Plusieurs créneaux : GitHub peut retarder ou sauter un run planifié.
    # Les runs en trop ne coûtent rien (le script ne garde que les nouveautés).
    # Heures en UTC : à Paris, +1 h l'hiver, +2 h l'été. Le dernier créneau
    # reste avant la veille de 6h30 dans les deux cas.
    # Constaté fin nov. 2026 : GitHub lance ces runs avec 7 à 11 h de retard.
    # Les créneaux du soir servent de filet pour que le digest soit prêt à 6h30.
    - cron: "7 16 * * *"   # 17h07 hiver / 18h07 été
    - cron: "23 19 * * *"  # 20h23 hiver / 21h23 été
    - cron: "37 22 * * *"  # 23h37 hiver / 0h37 été
    - cron: "7 1 * * *"    # 2h07 hiver / 3h07 été
    - cron: "23 2 * * *"   # 3h23 hiver / 4h23 été
    - cron: "37 3 * * *"   # 4h37 hiver / 5h37 été
  workflow_dispatch:        # lancement manuel possible depuis l'onglet Actions
  push:                     # relance quand on modifie les sources ou le script
    branches: [main]
    paths: [sources.json, collect.py, .github/workflows/collect.yml]

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install feedparser==6.0.11 requests==2.32.3
      - run: python collect.py
      - name: Enregistrer le digest
        run: |
          git config user.name "veille-bot"
          git config user.email "veille-bot@users.noreply.github.com"
          git add digest state
          git commit -m "Digest $(date -u +%Y-%m-%d)" || echo "Rien de nouveau"
          git push
