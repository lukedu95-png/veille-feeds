name: Collecte veille

on:
  schedule:
    - cron: "17 4 * * *"   # 4h17 UTC = 5h17 à Paris l'hiver, avant la veille de 6h40
  workflow_dispatch:        # lancement manuel possible depuis l'onglet Actions

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install feedparser==6.0.11 requests==2.32.3
      - run: python collect.py
      - name: Enregistrer le digest
        run: |
          git config user.name "veille-bot"
          git config user.email "veille-bot@users.noreply.github.com"
          git add digest state
          git commit -m "Digest $(date -u +%Y-%m-%d)" || echo "Rien de nouveau"
          git push
